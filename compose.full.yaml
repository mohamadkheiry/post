name: post-platform-final

# Full connected-development overlay. Every third-party image is from its
# upstream registry and locked to both a version tag and manifest digest.
# Refresh intentionally with scripts/infra/verify-image-locks.ps1.

x-app-healthcheck: &app-healthcheck
  test:
    - CMD-SHELL
    - >-
      bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
      printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
      IFS= read -r status <&3;
      [[ "$$status" == *" 200 "* ]]'
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 45s

x-core-connected-environment: &core-connected-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: "8080"
  Api__AuthenticationEnabled: "true"
  Api__SwaggerEnabled: "true"
  Api__MetricsEnabled: "true"
  Api__DevelopmentIdentity__Enabled: "false"
  Core__Infrastructure__Mode: Connected
  Core__Database__Provider: SqlServer
  Core__Database__ApplyMigrations: "true"
  Core__Database__AllowInsecureDevelopmentTransport: "true"
  Core__Outbox__Enabled: "true"
  Core__Outbox__PollingSeconds: "1"
  Messaging__Kafka__BootstrapServers: redpanda:9092
  Messaging__Kafka__SecurityProtocol: Plaintext
  Messaging__Kafka__ClientId: post-full-dev
  Messaging__Kafka__MaximumSendRetries: "3"
  Messaging__Kafka__DeliveryTimeoutMilliseconds: "15000"
  Messaging__Kafka__SocketTimeoutMilliseconds: "5000"

x-core-secret-env: &core-secret-env
  - path: ./.secrets/full-dev/core.env
    required: false

x-sql-healthcheck: &sql-healthcheck
  test:
    - CMD-SHELL
    - >-
      /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
      -P "$$MSSQL_SA_PASSWORD" -Q "SET NOCOUNT ON; SELECT 1" >/dev/null
  interval: 10s
  timeout: 8s
  retries: 30
  start_period: 45s

services:
  sql-volume-init:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04@sha256:7c29dfbac885ad7519e219c7fe4aee0e67283e21a10e9c252d13b0fbde1866f8
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - install -d -o 10001 -g 10001 -m 0700 /var/opt/mssql/ag
    volumes:
      - sql-ag-share:/var/opt/mssql/ag
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    mem_limit: 64m

  sql-primary:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04@sha256:7c29dfbac885ad7519e219c7fe4aee0e67283e21a10e9c252d13b0fbde1866f8
    hostname: sql-primary
    restart: unless-stopped
    env_file:
      - path: ./.secrets/full-dev/sql.env
        required: false
    environment:
      MSSQL_ENABLE_HADR: "1"
      MSSQL_AGENT_ENABLED: "true"
    depends_on:
      sql-volume-init:
        condition: service_completed_successfully
    healthcheck: *sql-healthcheck
    volumes:
      - sql-primary-data:/var/opt/mssql
      - sql-ag-share:/var/opt/mssql/ag
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    mem_limit: 2304m
    cpus: 1.5

  sql-secondary:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04@sha256:7c29dfbac885ad7519e219c7fe4aee0e67283e21a10e9c252d13b0fbde1866f8
    hostname: sql-secondary
    restart: unless-stopped
    profiles: ["ha"]
    env_file:
      - path: ./.secrets/full-dev/sql.env
        required: false
    environment:
      MSSQL_ENABLE_HADR: "1"
      MSSQL_AGENT_ENABLED: "true"
    depends_on:
      sql-volume-init:
        condition: service_completed_successfully
    healthcheck: *sql-healthcheck
    volumes:
      - sql-secondary-data:/var/opt/mssql
      - sql-ag-share:/var/opt/mssql/ag
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    mem_limit: 2304m
    cpus: 1.5

  sql-tde-configure:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04@sha256:7c29dfbac885ad7519e219c7fe4aee0e67283e21a10e9c252d13b0fbde1866f8
    restart: "no"
    env_file:
      - path: ./.secrets/full-dev/sql.env
        required: false
    entrypoint: ["/bin/bash", "/infra/configure-tde.sh"]
    depends_on:
      sql-primary:
        condition: service_healthy
    volumes:
      - ./infra/sql/configure-tde.sh:/infra/configure-tde.sh:ro
      - sql-ag-share:/var/opt/mssql/ag
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  sql-ag-configure:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04@sha256:7c29dfbac885ad7519e219c7fe4aee0e67283e21a10e9c252d13b0fbde1866f8
    profiles: ["ha"]
    restart: "no"
    env_file:
      - path: ./.secrets/full-dev/sql.env
        required: false
    entrypoint: ["/bin/bash", "/infra/configure-ag.sh"]
    depends_on:
      sql-primary:
        condition: service_healthy
      sql-secondary:
        condition: service_healthy
      sql-tde-configure:
        condition: service_completed_successfully
    volumes:
      - ./infra/sql-ag/configure-ag.sh:/infra/configure-ag.sh:ro
      - sql-ag-share:/var/opt/mssql/ag
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  redis:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    restart: unless-stopped
    env_file:
      - path: ./.secrets/full-dev/redis.env
        required: false
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test -n "$${POST_REDIS_USER:-}";
        test -n "$${POST_REDIS_PASSWORD:-}";
        umask 077;
        printf 'bind 0.0.0.0\nprotected-mode yes\nappendonly no\nsave ""\nuser default off\nuser %s on >%s ~* +@all\n' "$${POST_REDIS_USER}" "$${POST_REDIS_PASSWORD}" >/run/redis/redis.conf;
        unset POST_REDIS_PASSWORD;
        exec redis-server /run/redis/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user \"$$POST_REDIS_USER\" -a \"$$POST_REDIS_PASSWORD\" --no-auth-warning ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs:
      - /run/redis:size=8m,mode=0700
      - /tmp:size=16m,mode=1777
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    mem_limit: 256m
    cpus: 0.25

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers=localhost:9092 >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 20s
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    mem_limit: 1280m
    cpus: 0.75

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
    restart: "no"
    entrypoint: ["/bin/bash", "/infra/create-topics.sh"]
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./infra/redpanda/create-topics.sh:/infra/create-topics.sh:ro
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    mem_limit: 128m

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    env_file:
      - path: ./.secrets/full-dev/minio.env
        required: false
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test -n "$${MINIO_ROOT_USER:-}";
        test -n "$${MINIO_ROOT_PASSWORD:-}";
        test -n "$${MINIO_KMS_SECRET_KEY:-}";
        exec minio server /data --console-address :9001
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - minio-data:/data
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    mem_limit: 512m
    cpus: 0.5

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    restart: "no"
    env_file:
      - path: ./.secrets/full-dev/minio.env
        required: false
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: ["/bin/sh", "/infra/configure-bucket.sh"]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/configure-bucket.sh:/infra/configure-bucket.sh:ro
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m

  identity:
    environment:
      <<: *core-connected-environment
    env_file: *core-secret-env
    healthcheck: *app-healthcheck
    depends_on:
      sql-primary:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 384m
    cpus: 0.4

  data-ingestion:
    environment:
      <<: *core-connected-environment
    env_file: *core-secret-env
    healthcheck: *app-healthcheck
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 320m
    cpus: 0.4

  parcel-lifecycle:
    environment:
      <<: *core-connected-environment
      Redis__Enabled: "true"
      Redis__RequireTls: "false"
      Redis__InstancePrefix: post:full-dev
      Redis__EntryTtl: "00:30:00"
      Redis__CleanupInterval: "00:00:30"
      Messaging__Kafka__ConsumerMaximumDeliveryAttempts: "2"
      Messaging__Kafka__ConsumerFailureRetrySeconds: "1"
    env_file: *core-secret-env
    healthcheck: *app-healthcheck
    depends_on:
      sql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 448m
    cpus: 0.5

  device-config:
    environment:
      <<: *core-connected-environment
    env_file: *core-secret-env
    healthcheck: *app-healthcheck
    depends_on:
      sql-primary:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 384m
    cpus: 0.4

  object-storage:
    environment:
      <<: *core-connected-environment
      Core__Outbox__Enabled: "false"
      Core__S3__Endpoint: http://minio:9000
      Core__S3__Region: us-east-1
      Core__S3__Bucket: post-images
      Core__S3__ForcePathStyle: "true"
      Core__S3__RequireServerSideEncryption: "true"
    env_file: *core-secret-env
    healthcheck: *app-healthcheck
    depends_on:
      minio-init:
        condition: service_completed_successfully
    mem_limit: 320m
    cpus: 0.3

  edge-health:
    environment:
      <<: *core-connected-environment
      Core__EdgeHealthMonitor__CheckIntervalSeconds: "5"
      Core__EdgeHealthMonitor__StaleThresholdSeconds: "30"
    env_file: *core-secret-env
    healthcheck: *app-healthcheck
    depends_on:
      sql-primary:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 384m
    cpus: 0.4

  operational-result:
    environment:
      <<: *core-connected-environment
      Redis__Enabled: "true"
      Redis__RequireTls: "false"
      Redis__InstancePrefix: post:full-dev
      Redis__EntryTtl: "00:30:00"
      Redis__CleanupInterval: "00:00:30"
    env_file: *core-secret-env
    healthcheck: *app-healthcheck
    depends_on:
      sql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 384m
    cpus: 0.4

  gateway:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Auth__AuthenticationEnabled: "true"
      Auth__RequireHttpsMetadata: "false"
      Api__MetricsEnabled: "true"
    env_file: *core-secret-env
    healthcheck: *app-healthcheck
    depends_on:
      identity:
        condition: service_healthy
      data-ingestion:
        condition: service_healthy
      parcel-lifecycle:
        condition: service_healthy
      device-config:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      edge-health:
        condition: service_healthy
      operational-result:
        condition: service_healthy
      sql-tde-configure:
        condition: service_completed_successfully
    mem_limit: 320m
    cpus: 0.4

  edge:
    profiles: ["connected-edge"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Api__AuthenticationEnabled: "false"
      Api__SwaggerEnabled: "true"
      Api__MetricsEnabled: "true"
      Edge__Integrations__Profile: CoreConnected
      Edge__Integrations__Destination: Mock
      Edge__Integrations__Postal: Mock
      Edge__Integrations__Core: Real
      Edge__Storage__ConnectionString: Data Source=/data/edge/edge.db
      Edge__Storage__ApplyMigrationsOnStartup: "true"
      Edge__Storage__EncryptionEnabled: "true"
      Edge__Storage__EncryptionKeyEnvironmentVariable: POST_EDGE_SQLITE_KEY
      Edge__Storage__BackupDirectory: /data/edge/backups
      Edge__LocalAdmin__AuthenticationEnabled: "true"
      Edge__Security__AllowUnboundDevices: "true"
      Edge__Security__AllowInsecureDevelopmentIntegrations: "true"
      Edge__Security__AllowedInsecureDevelopmentHosts__0: gateway
      Edge__CoreApi__BaseAddress: http://gateway:8080
      Edge__CoreApi__EdgeId: "33333333-3333-4333-8333-333333333333"
      Edge__CoreApi__ExchangeCenterCode: "12345"
      Edge__CoreApi__UseFixedBearerToken: "false"
      Edge__CoreApi__RequestTimeout: "00:00:15"
      Edge__Workers__PollInterval: "00:00:01"
      Edge__Workers__ConfigurationSyncInterval: "00:00:05"
      Edge__Workers__HeartbeatInterval: "00:00:05"
    env_file:
      - path: ./.secrets/full-dev/edge.env
        required: false
    healthcheck:
      <<: *app-healthcheck
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "promtool", "check", "healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    mem_limit: 384m
    cpus: 0.3

  loki:
    image: grafana/loki:3.5.3@sha256:3165cecce301ce5b9b6e3530284b080934a05cd5cafac3d3d82edcb887b45ecd
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    mem_limit: 384m
    cpus: 0.3

  alloy:
    image: grafana/alloy:v1.10.0@sha256:1bc130e909116a4bf950eb5187a346007d3b796f96832b529acb14a64e41230f
    profiles: ["observability"]
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./infra/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.2

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    profiles: ["observability"]
    restart: unless-stopped
    env_file:
      - path: ./.secrets/full-dev/grafana.env
        required: false
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    mem_limit: 384m
    cpus: 0.3

  e2e-client:
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "-ec"]
    command: ["true"]
    networks:
      - post-backend
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 64m

networks:
  post-backend:
    internal: true

volumes:
  sql-primary-data:
  sql-secondary-data:
  sql-ag-share:
  redpanda-data:
  minio-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
